name: CI
on: [pull_request]

jobs:
  beefore:
    name: Pre-test checks
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        task: ['pycodestyle']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install --upgrade pip setuptools beefore
    - name: Run Beefore checks
      env:
        GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        beefore --username github-actions --repository ${{ github.repository }} --pull-request ${{ github.event.number }} --commit ${{ github.event.pull_request.head.sha }} ${{ matrix.task }} .

  smoke:
    name: Smoke test
    needs: beefore
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install "django<4" "pytest<8" "toga-core==0.3.1" "toga-dummy==0.3.1" "travertino<0.4"
        pip install -e . --no-deps
    - name: Test
      env:
        TOGA_BACKEND: toga_dummy
      run: |
        python -m unittest discover

  python-versions:
    name: Python compatibility test
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.10']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install "django<4" "pytest<8" "toga-core==0.3.1" "toga-dummy==0.3.1" "travertino<0.4"
        pip install -e . --no-deps
    - name: Test
      env:
        TOGA_BACKEND: toga_dummy
      run: |
        python -m unittest discover
