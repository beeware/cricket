name: Create Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: $/.github/workflows/ci.yml
    with:
      attest-package: "true"

  release:
    name: Create Release
    needs: [ci]
    # This has to be run on macOS, because rubicon tries to load the Foundation library
    runs-on: macOS-latest
    permissions:
      contents: write
    steps:
      - name: Set build variables
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" | tee -a $GITHUB_ENV

      - name: Get packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "dist-*"
          merge-multiple: true
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$VERSION" dist/*

  test-publish:
    name: Publish test package
    needs: [ci, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Get packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "dist-*"
          merge-multiple: true
          path: dist

      - name: Publish release to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
