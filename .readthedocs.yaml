# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Docs are always built on Python 3.13. See also the tox config.
    python: "3.13"
  apt_packages:
    # Toga's GTK backend (installed on Linux) requires GObject and GTK libraries
    # to build/import PyGObject and Pycairo, which aren't present in the RTD image.
    - libgirepository1.0-dev
    - libgtk-3-dev
    - libcairo2-dev
    - libcairo-gobject2
  jobs:
    post_checkout:
      - git fetch --unshallow
    pre_install:
      - python -m pip install --upgrade pip
      - python -m pip install --group tox
    build:
      html:
        - python -m tox -e docs-all -- --output=$READTHEDOCS_OUTPUT/html/
